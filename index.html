<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10294A">
<title>وقتي — الحضور والانصراف</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F2F4F7;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:#111;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
input,textarea,select{font-family:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:#F2F4F7}
.pad{padding:22px 18px 18px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{background:#fff;border:1px solid #E2E6EC;border-radius:14px}
.h1{font-size:21px;font-weight:600;line-height:1.25;color:#10294A;margin:0}
.h2{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#8A929C;font-family:"IBM Plex Mono",monospace;margin:0}
.mono{font-family:"IBM Plex Mono",monospace}
.muted{color:#6B7580;font-size:13px;line-height:1.65}
.row{display:flex;align-items:center;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:#fff;border:1px solid #E2E6EC;border-radius:13px;padding:13px 12px}
.stat b{display:block;margin-top:7px;font:600 17px/1 "IBM Plex Mono",monospace;color:#10294A}
.stat span{font-size:10.5px;color:#8A929C}
.btn{width:100%;padding:16px;border:0;border-radius:13px;background:#10294A;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45}
.btn.ghost{background:#fff;color:#10294A;border:1px solid #E2E6EC}
.btn.danger{background:#fff;color:#8C1D1D;border:1px solid #EFD2D2}
.field{width:100%;padding:14px;border:1px solid #E2E6EC;border-radius:12px;background:#fff;font-size:14px;color:#111}
.label{display:block;font-size:11.5px;color:#8A929C;margin:0 0 7px}
.pill{flex:none;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:500}
.pill.ok{background:#EAF3EC;color:#1B6340}
.pill.late{background:#FDF1E7;color:#8E4308}
.pill.off{background:#F0F2F5;color:#6B7580}
.pill.bad{background:#FBEDED;color:#8C1D1D}
.pill.pend{background:#FDF6EA;color:#8E4308}
.banner{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;font-size:12.5px;font-weight:500}
.dot{width:9px;height:9px;border-radius:9px;flex:none}
.punch{width:200px;height:200px;border-radius:100px;border:0;color:#fff;background:#10294A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 16px 34px -14px rgba(16,41,74,.55)}
.punch.out{background:#8E2D2D}
.punch:disabled{background:#fff;color:#10294A;border:1.5px solid #D6DBE2;box-shadow:none}
.punch em{font-style:normal;font-size:12px;opacity:.75}
.punch strong{font-size:24px;font-weight:600}
.punch small{font-family:"IBM Plex Mono",monospace;font-size:12.5px;opacity:.8}
.tabs{flex:none;display:flex;gap:4px;background:#fff;border-top:1px solid #E2E6EC;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border:0;background:transparent;color:#AAB2BC;font-size:10.5px;font-weight:500;cursor:pointer}
.tab.on{color:#10294A}
.tab i{display:block;width:16px;height:16px;border:2px solid currentColor;border-radius:4px}
.tab.log i{border-radius:2px;height:14px;border-width:2px 2px 6px}
.tab.leave i{border-top-width:5px}
.tab.more i{border:0;height:4px;border-radius:4px;background:currentColor;box-shadow:0 6px 0 currentColor,0 -6px 0 currentColor;width:4px}
.tab.rep i{border-radius:50%}
.list>*+*{margin-top:7px}
.line{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E2E6EC;border-radius:12px;padding:12px 13px;width:100%;text-align:start}
.dark{position:fixed;inset:0;background:#10294A;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:28px;gap:16px;text-align:center;z-index:50}
.dark.warn{background:#5A1A1A}
.dark h3{margin:0;font-size:21px;font-weight:600;line-height:1.35}
.dark p{margin:0;font-size:13px;line-height:1.75;color:rgba(255,255,255,.68)}
.dark .big{font:500 30px/1 "IBM Plex Mono",monospace}
.spin{width:38px;height:38px;border-radius:19px;border:3px solid rgba(255,255,255,.18);border-top-color:#4C9AE8;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom));background:#10294A;color:#fff;padding:14px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
.toast.err{background:#8C1D1D}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 9px;border:1px solid #E2E6EC;text-align:start}
th{background:#F2F4F7;font-weight:600;color:#10294A;font-size:11.5px}
a{color:#1B4C7E}
</style>
</head>
<body>
<div id="app"><div class="pad"><div class="muted">جاري التحميل…</div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where,
  orderBy, getDocs, addDoc, serverTimestamp, onSnapshot, enableIndexedDbPersistence,
  Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------- الإعداد ---------- */
// بيانات مشروعك مثبّتة هنا — الموظف مش محتاج يعمل أي حاجة.
const DEFAULT_CFG = {
  apiKey: "AIzaSyD1BIciu8R6_o-0xmWCd4xEDKb1QrhHhtY",
  authDomain: "professional-print-bd10c.firebaseapp.com",
  projectId: "professional-print-bd10c",
  storageBucket: "professional-print-bd10c.firebasestorage.app",
  messagingSenderId: "386401773561",
  appId: "1:386401773561:web:7ccf72810c25bf8e63ff28"
};
const CFG_KEY = "waqti.cfg";
let cfg = null;
try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch (e) { cfg = null; }
if (!cfg || !cfg.apiKey) {
  cfg = DEFAULT_CFG;
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
}

const app = document.getElementById("app");
const S = {
  screen: "boot", user: null, me: null, branches: [], shifts: [],
  today: null, month: [], monthOffset: 0, requests: [], teamToday: [],
  pending: [], people: [], myTeamIds: [], decided: [], busy: false, overlay: null, toast: null,
  qrInput: "", form: {}, online: navigator.onLine
};

let fb = {};
function boot() {
  if (!cfg) { S.screen = "setup"; return render(); }
  try {
    fb.app = initializeApp(cfg);
    fb.auth = getAuth(fb.app);
    fb.db = getFirestore(fb.app);
    enableIndexedDbPersistence(fb.db).catch(() => {});
    onAuthStateChanged(fb.auth, onUser);
  } catch (e) {
    S.screen = "setup"; S.toast = { t: "الإعدادات غلط: " + e.message, err: true }; render();
  }
}

/* ---------- أدوات ---------- */
const pad = n => String(n).padStart(2, "0");
const hhmm = m => pad(Math.floor(m / 60)) + ":" + pad(Math.round(m % 60));
const fmtT = d => d ? pad(d.getHours()) + ":" + pad(d.getMinutes()) : "--:--";
const dkey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const toDate = v => v && v.toDate ? v.toDate() : (v instanceof Date ? v : null);
const DOW = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(t, err) { S.toast = { t, err }; render(); setTimeout(() => { S.toast = null; render(); }, 3200); }
const isMgr = () => S.me && (S.me.role === "manager" || S.me.role === "admin");
const isAdmin = () => S.me && S.me.role === "admin";
function myShift() { return S.shifts.find(x => x.id === (S.me && S.me.shiftId)) || { startMinute: 540, endMinute: 1020, graceMinutes: 5, workdays: [0, 1, 2, 3, 4], name: "الوردية" }; }
function shiftFor(p) {
  return S.shifts.find(x => x.id === (p && p.shiftId)) || { startMinute: 540, endMinute: 1020, graceMinutes: 5, name: "الوردية" };
}
// كل اللي تحتي في الشجرة — مباشر وغير مباشر
function subtreeIds(rootUid, all) {
  const kids = {};
  all.forEach(p => {
    const m = p.managerUid || "";
    if (!kids[m]) kids[m] = [];
    kids[m].push(p.id);
  });
  const out = [], stack = (kids[rootUid] || []).slice();
  const seen = {};
  while (stack.length) {
    const id = stack.pop();
    if (seen[id]) continue;
    seen[id] = 1; out.push(id);
    (kids[id] || []).forEach(k => stack.push(k));
  }
  return out;
}
function myBranch() { return S.branches.find(x => x.id === (S.me && S.me.branchId)) || null; }

/* ---------- تحميل البيانات ---------- */
async function onUser(u) {
  S.user = u;
  if (!u) { S.me = null; S.screen = "auth"; return render(); }
  S.screen = "loading"; render();
  const ref = doc(fb.db, "employees", u.uid);
  let snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, {
      uid: u.uid, email: u.email, name: u.displayName || (u.email || "").split("@")[0],
      employeeId: "", role: "employee", branchId: "", shiftId: "",
      active: false, createdAt: serverTimestamp()
    });
    snap = await getDoc(ref);
  }
  S.me = { id: u.uid, ...snap.data() };
  // مدير النظام (الإيميل الموجود في قواعد الأمان) يفعّل نفسه تلقائياً
  if (!S.me.active || S.me.role !== "admin") {
    try {
      await updateDoc(ref, { active: true, role: "admin" });
      S.me.active = true; S.me.role = "admin";
    } catch (e) { /* مش مدير نظام — عادي */ }
  }
  if (!S.me.active) { S.screen = "pending"; return render(); }
  await loadCommon();
  S.screen = isMgr() ? "mdash" : "home";
  render();
  watchToday();
}
async function loadCommon() {
  const [b, sh] = await Promise.all([getDocs(collection(fb.db, "branches")), getDocs(collection(fb.db, "shifts"))]);
  S.branches = b.docs.map(d => ({ id: d.id, ...d.data() }));
  S.shifts = sh.docs.map(d => ({ id: d.id, ...d.data() }));
  await loadMonth();
  await loadRequests();
}
let unsubToday = null;
function watchToday() {
  if (unsubToday) unsubToday();
  const id = S.user.uid + "_" + dkey(new Date());
  unsubToday = onSnapshot(doc(fb.db, "attendance", id), s => {
    S.today = s.exists() ? { id: s.id, ...s.data() } : null;
    if (S.screen === "home") render();
  }, () => {});
}
async function loadMonth() {
  const base = new Date();
  const d = new Date(base.getFullYear(), base.getMonth() + S.monthOffset, 1);
  const from = dkey(new Date(d.getFullYear(), d.getMonth(), 1));
  const to = dkey(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  // استعلام على uid فقط — عشان ما يحتاجش فهرس مركب. الفلترة بالشهر هنا.
  const r = await getDocs(query(collection(fb.db, "attendance"), where("uid", "==", S.user.uid)));
  S.month = r.docs.map(x => ({ id: x.id, ...x.data() }))
    .filter(x => x.date >= from && x.date <= to)
    .sort((a, b) => b.date.localeCompare(a.date));
  S.monthMeta = { y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString("ar-EG", { month: "long", year: "numeric" }) };
}
async function loadRequests() {
  const mine = await getDocs(query(collection(fb.db, "requests"), where("uid", "==", S.user.uid)));
  S.requests = mine.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
  if (isMgr()) {
    if (!S.people.length) {
      const emp = await getDocs(collection(fb.db, "employees"));
      S.people = emp.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    S.myTeamIds = isAdmin() ? S.people.map(p => p.id) : subtreeIds(S.user.uid, S.people);
    const p = await getDocs(query(collection(fb.db, "requests"), where("status", "==", "pending")));
    S.pending = p.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(r => r.uid !== S.user.uid && S.myTeamIds.indexOf(r.uid) !== -1);
    // مدير النطام: قرارات المديرين الأخيرة — يقدر يعدلها
    if (isAdmin()) {
      const all = await getDocs(collection(fb.db, "requests"));
      S.decided = all.docs.map(d => ({ id: d.id, ...d.data() }))
        .filter(r => r.status !== "pending" && r.uid !== S.user.uid)
        .sort((a, b) => (toDate(b.decidedAt) || 0) - (toDate(a.decidedAt) || 0))
        .slice(0, 20);
    }
  }
}
async function loadTeamToday() {
  const today = dkey(new Date());
  const [emp, att] = await Promise.all([
    getDocs(collection(fb.db, "employees")),
    getDocs(query(collection(fb.db, "attendance"), where("date", "==", today)))
  ]);
  const byUid = {};
  att.docs.forEach(d => { byUid[d.data().uid] = d.data(); });
  S.people = emp.docs.map(d => ({ id: d.id, ...d.data() }));      // الكل — بما فيهم الموقوفين
  S.myTeamIds = isAdmin() ? S.people.map(p => p.id) : subtreeIds(S.user.uid, S.people);
  S.teamToday = S.people
    .filter(p => p.active && (isAdmin() || S.myTeamIds.indexOf(p.id) !== -1))
    .map(p => ({ p, a: byUid[p.id] || null }));
}

/* ---------- المنطق ---------- */
function dayStats(rec, shiftOverride) {
  const sh = shiftOverride || myShift();
  const ci = toDate(rec && rec.checkInAt), co = toDate(rec && rec.checkOutAt);
  if (!ci) return { worked: 0, late: 0, ot: 0, status: "none" };
  const inMin = ci.getHours() * 60 + ci.getMinutes();
  const late = Math.max(0, inMin - sh.startMinute - (sh.graceMinutes || 0));
  const worked = co ? Math.max(0, Math.round((co - ci) / 60000)) : 0;
  const outMin = co ? co.getHours() * 60 + co.getMinutes() : 0;
  const ot = co ? Math.max(0, outMin - sh.endMinute - (sh.otAfterMinutes != null ? sh.otAfterMinutes : 15)) : 0;
  return { worked, late, ot, status: late > 0 ? "late" : "ok" };
}
function monthSummary() {
  let days = 0, late = 0, mins = 0, ot = 0;
  S.month.forEach(r => {
    const st = dayStats(r);
    if (st.status === "none") return;
    days++; if (st.late > 0) late++; mins += st.worked; ot += st.ot;
  });
  return { days, late, hours: Math.round(mins / 60), otMin: ot, ot: hhmm(ot) };
}
function inBranchBox(coords, br) {
  if (!br) return false;
  const dLat = Math.abs(coords.latitude - br.lat);
  const dLng = Math.abs(coords.longitude - br.lng);
  return dLat <= (br.latDelta || 0.0014) && dLng <= (br.lngDelta || 0.0016);
}
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("الجهاز مش بيدعم تحديد الموقع"));
    navigator.geolocation.getCurrentPosition(p => res(p.coords),
      e => rej(new Error(e.code === 1 ? "إذن الموقع مرفوض" : "مش قادر أحدد الموقع")),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  });
}
async function punch(method) {
  if (S.busy) return;
  S.busy = true;
  const kind = S.today && S.today.checkInAt && !S.today.checkOutAt ? "out" : "in";
  if (S.today && S.today.checkInAt && S.today.checkOutAt) { S.busy = false; return toast("سجلت حضور وانصراف النهاردة بالفعل"); }
  try {
    let coords = null, branchId = S.me.branchId || "", code = null;
    if (method === "gps") {
      S.overlay = { kind: "locating" }; render();
      const c = await getPos();
      coords = { latitude: c.latitude, longitude: c.longitude, accuracy: Math.round(c.accuracy || 0) };
      const br = myBranch();
      if (!inBranchBox(coords, br)) {
        S.overlay = { kind: "blocked", title: "انت خارج نطاق " + (br ? br.name : "الفرع"), body: "قرّب من المكتب وجرب تاني، أو استخدم كود الاستقبال." };
        S.busy = false; return render();
      }
      branchId = br.id;
    } else {
      code = (S.qrInput || "").trim().toUpperCase();
      if (code.length < 4) { S.busy = false; return toast("اكتب الكود الظاهر على شاشة الاستقبال", true); }
      const br = myBranch();
      branchId = br ? br.id : (S.branches[0] && S.branches[0].id) || "";
    }
    S.overlay = { kind: "saving" }; render();
    const id = S.user.uid + "_" + dkey(new Date());
    const ref = doc(fb.db, "attendance", id);
    const now = new Date();
    const base = {
      uid: S.user.uid, date: dkey(now), name: S.me.name,
      branchId, employeeId: S.me.employeeId || ""
    };
    const part = kind === "in"
      ? { checkInAt: serverTimestamp(), checkInDeviceTime: Timestamp.fromDate(now), checkInMethod: method, checkInCoords: coords, checkInCode: code }
      : { checkOutAt: serverTimestamp(), checkOutDeviceTime: Timestamp.fromDate(now), checkOutMethod: method, checkOutCoords: coords, checkOutCode: code };
    const exists = S.today != null;
    if (exists) await updateDoc(ref, part); else await setDoc(ref, { ...base, ...part });
    S.qrInput = "";
    S.overlay = { kind: "done", kindPunch: kind, at: now };
    await loadMonth();
  } catch (e) {
    S.overlay = { kind: "blocked", title: "التسجيل مرفوض", body: (e && e.message) || "حصل خطأ. جرب تاني." };
  }
  S.busy = false; render();
}

async function submitLeave() {
  const f = S.form;
  if (!f.from || !f.to || !(f.reason || "").trim()) return toast("املأ التواريخ والسبب", true);
  if (f.to < f.from) return toast("تاريخ النهاية قبل البداية", true);
  await addDoc(collection(fb.db, "requests"), {
    uid: S.user.uid, name: S.me.name, employeeId: S.me.employeeId || "",
    managerUid: S.me.managerUid || "", branchId: S.me.branchId || "",
    kind: "leave", type: f.type || "annual", from: f.from, to: f.to,
    reason: f.reason.trim(), status: "pending", createdAt: serverTimestamp()
  });
  S.form = {}; await loadRequests(); S.screen = "leave"; toast("تم إرسال الطلب");
}
async function decide(r, ok) {
  await updateDoc(doc(fb.db, "requests", r.id), {
    status: ok ? "approved" : "rejected", decidedBy: S.user.uid,
    decidedByName: S.me.name, decidedAt: serverTimestamp()
  });
  await loadRequests(); render();
}
async function saveEmployee(p, patch) {
  await updateDoc(doc(fb.db, "employees", p.id), patch);
  await loadTeamToday(); render(); toast("تم الحفظ");
}

/* ---------- تصدير Excel ---------- */
async function exportCsv() {
  const d = new Date(new Date().getFullYear(), new Date().getMonth() + S.monthOffset, 1);
  const from = dkey(new Date(d.getFullYear(), d.getMonth(), 1));
  const to = dkey(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  const [r, emp] = await Promise.all([
    getDocs(query(collection(fb.db, "attendance"), where("date", ">=", from), where("date", "<=", to))),
    getDocs(collection(fb.db, "employees"))
  ]);
  // وردية كل موظف على حدا، مش وردية المدير
  const shiftOf = {};
  const shById = {};
  S.shifts.forEach(s => { shById[s.id] = s; });
  emp.docs.forEach(d => { shiftOf[d.id] = shById[d.data().shiftId] || null; });
  const fallback = { startMinute: 540, endMinute: 1020, graceMinutes: 5 };
  const rows = [["الموظف", "الرقم الوظيفي", "التاريخ", "اليوم", "الوردية", "الحضور", "الانصراف", "الساعات", "التأخير (دقيقة)", "إضافي (دقيقة)", "الطريقة", "الحالة"]];
  // \u0627\u0644\u062a\u0642\u0631\u064a\u0631 \u0641\u0631\u064a\u0642 \u0627\u0644\u0645\u062f\u064a\u0631 \u0628\u0633 \u2014 \u0648\u0645\u062f\u064a\u0631 \u0627\u0644\u0646\u0637\u0627\u0645 \u064a\u0634\u0648\u0641 \u0627\u0644\u0643\u0644\n  const allowed = isAdmin() ? null : S.myTeamIds.concat([S.user.uid]);\n  r.docs.map(x => x.data())\n    .filter(a => !allowed || allowed.indexOf(a.uid) !== -1)\n    .sort((a, b) => a.date.localeCompare(b.date) || String(a.name).localeCompare(String(b.name))).forEach(a => {
    const sh = shiftOf[a.uid] || fallback;
    const ci = toDate(a.checkInAt), co = toDate(a.checkOutAt);
    const inMin = ci ? ci.getHours() * 60 + ci.getMinutes() : 0;
    const late = ci ? Math.max(0, inMin - sh.startMinute - (sh.graceMinutes || 0)) : 0;
    const worked = ci && co ? Math.round((co - ci) / 60000) : 0;
    const outMin = co ? co.getHours() * 60 + co.getMinutes() : 0;
    const ot = co ? Math.max(0, outMin - sh.endMinute - (sh.otAfterMinutes != null ? sh.otAfterMinutes : 15)) : 0;
    rows.push([a.name || "", a.employeeId || "", a.date, DOW[new Date(a.date).getDay()],
      sh.name || "—", fmtT(ci), fmtT(co), worked ? hhmm(worked) : "", late || "", ot || "",
      a.checkInMethod === "qr" ? "كود" : "موقع", late > 0 ? "متأخر" : ci ? "منتظم" : "غياب"]);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = "attendance-" + from.slice(0, 7) + ".csv"; a.click();
  URL.revokeObjectURL(url);
  toast("تم تنزيل الملف — يفتح في Excel");
}

let deferredPrompt = null;

function grab(id) { const el = document.getElementById(id); return el ? el.value : ""; }
function bind() {
  app.querySelectorAll("[data-a]").forEach(el => {
    el.addEventListener("click", ev => {
      const a = el.getAttribute("data-a"), v = el.getAttribute("data-v");
      ev.preventDefault(); act(a, v, el);
    });
  });
  const qr = document.getElementById("f_qr");
  if (qr) qr.addEventListener("input", e => { S.qrInput = e.target.value; });
  ["f_email", "f_pass", "f_name", "f_from", "f_to", "f_reason"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", e => {
      const k = id.slice(2);
      S.form[k === "pass" ? "pass" : k] = e.target.value;
    });
  });
}
async function act(a, v, el) {
  try {
    if (a === "saveCfg") {
      const c = { apiKey: grab("c_apiKey").trim(), authDomain: grab("c_authDomain").trim(), projectId: grab("c_projectId").trim(), appId: grab("c_appId").trim() };
      const sb = grab("c_storageBucket").trim(), ms = grab("c_messagingSenderId").trim();
      if (sb) c.storageBucket = sb; if (ms) c.messagingSenderId = ms;
      if (!c.apiKey || !c.projectId || !c.appId) return toast("apiKey و projectId و appId مطلوبين", true);
      localStorage.setItem(CFG_KEY, JSON.stringify(c)); location.reload(); return;
    }
    if (a === "pasteCfg") {
      let raw = grab("c_json").trim();
      const m = raw.match(/\{[\s\S]*\}/); if (m) raw = m[0];
      raw = raw.replace(/([{,]\s*)([A-Za-z_]+)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, "}");
      const c = JSON.parse(raw);
      localStorage.setItem(CFG_KEY, JSON.stringify(c)); location.reload(); return;
    }
    if (a === "resetCfg") { localStorage.removeItem(CFG_KEY); location.reload(); return; }
    if (a === "toggleMode") { S.form.mode = S.form.mode === "signup" ? "login" : "signup"; return render(); }
    if (a === "login") {
      const e = grab("f_email").trim(), p = grab("f_pass");
      if (!e || !p) return toast("الإيميل وكلمة السر مطلوبين", true);
      await signInWithEmailAndPassword(fb.auth, e, p); return;
    }
    if (a === "signup") {
      const e = grab("f_email").trim(), p = grab("f_pass"), n = grab("f_name").trim();
      if (!e || p.length < 6) return toast("كلمة السر ٦ حروف على الأقل", true);
      const cred = await createUserWithEmailAndPassword(fb.auth, e, p);
      await setDoc(doc(fb.db, "employees", cred.user.uid), {
        uid: cred.user.uid, email: e, name: n || e.split("@")[0], employeeId: "",
        role: "employee", branchId: "", shiftId: "", active: false, createdAt: serverTimestamp()
      });
      return;
    }
    if (a === "logout") { await signOut(fb.auth); S.form = {}; return; }
    if (a === "reload") return location.reload();
    if (a === "closeOverlay") { S.overlay = null; return render(); }
    if (a === "punchGps") return punch("gps");
    if (a === "punchQr") return punch("qr");
    if (a === "go") {
      S.screen = v;
      if (v === "log") { await loadMonth(); }
      if (v === "leave") { await loadRequests(); }
      if (v === "mdash" || v === "mrep") { await loadTeamToday(); }
      if (v === "mappr") { await loadRequests(); }
      return render();
    }
    if (a === "goLeaveNew") { S.form = { type: "annual" }; S.screen = "leaveNew"; return render(); }
    if (a === "goLeave") { S.screen = "leave"; return render(); }
    if (a === "goMore") { S.screen = "more"; return render(); }
    if (a === "goMDash") { await loadTeamToday(); S.screen = "mdash"; return render(); }
    if (a === "goMAppr") { S.screen = "mappr"; return render(); }
    if (a === "goPeople") { await loadTeamToday(); S.screen = "people"; return render(); }
    if (a === "goSetupData") { S.form = {}; S.screen = "setupData"; return render(); }
    if (a === "setType") { S.form.type = v; return render(); }
    if (a === "submitLeave") {
      S.form.from = grab("f_from"); S.form.to = grab("f_to"); S.form.reason = grab("f_reason");
      return submitLeave();
    }
    if (a === "prevMonth") { S.monthOffset--; await loadMonth(); return render(); }
    if (a === "nextMonth") { if (S.monthOffset >= 0) return; S.monthOffset++; await loadMonth(); return render(); }
    if (a === "exportCsv") { await loadTeamToday(); return exportCsv(); }
    if (a === "approve") return decide(S.pending.find(r => r.id === v), true);
    if (a === "reject") return decide(S.pending.find(r => r.id === v), false);
    if (a === "override") {
      const ok = el.getAttribute("data-ok") === "1";
      if (!confirm(ok ? "تغيير القرار لموافقة؟" : "تغيير القرار لرفض؟")) return;
      await decide(S.decided.find(r => r.id === v), ok);
      return toast("تم تعديل القرار");
    }
    if (a === "toggleActive") {
      const p = S.people.find(x => x.id === v);
      return saveEmployee(p, { active: !p.active });
    }
    if (a === "savePerson") {
      const p = S.people.find(x => x.id === v), patch = {};
      app.querySelectorAll(`[data-p="${v}"]`).forEach(f => { patch[f.getAttribute("data-k")] = f.value; });
      return saveEmployee(p, patch);
    }
    if (a === "editBranch") { S.form = { editBranch: v }; return render(); }
    if (a === "editShift") { S.form = { editShift: v }; return render(); }
    if (a === "cancelEdit") { S.form = {}; return render(); }
    if (a === "reHere") {
      const c = await getPos();
      S.form.ebLat = c.latitude; S.form.ebLng = c.longitude;
      return render();
    }
    if (a === "saveBranch") {
      const b = S.branches.find(x => x.id === v);
      const name = grab("eb_name").trim(), r = parseInt(grab("eb_radius") || "150", 10);
      if (!name) return toast("الاسم مطلوب", true);
      const lat = S.form.ebLat != null ? S.form.ebLat : b.lat;
      const lng = S.form.ebLng != null ? S.form.ebLng : b.lng;
      const latDelta = r / 111320, lngDelta = r / (111320 * Math.max(0.2, Math.cos(lat * Math.PI / 180)));
      await updateDoc(doc(fb.db, "branches", v), {
        name, lat, lng, radiusMeters: r,
        latDelta: +latDelta.toFixed(7), lngDelta: +lngDelta.toFixed(7)
      });
      S.form = {}; await loadCommon(); toast("تم حفظ الفرع"); return render();
    }
    if (a === "delBranch") {
      if (!confirm("تحذف الفرع؟ الموظفين المربوطين بيه مش هيقدروا يسجلوا لحد ما تحددلهم فرع تاني.")) return;
      await deleteDoc(doc(fb.db, "branches", v));
      S.form = {}; await loadCommon(); toast("تم الحذف"); return render();
    }
    if (a === "saveShift") {
      const name = grab("es_name").trim(), st = grab("es_start"), en = grab("es_end");
      const g = parseInt(grab("es_grace") || "0", 10), ot = parseInt(grab("es_ot") || "15", 10);
      if (!name || !st || !en) return toast("املأ البيانات", true);
      const toM = t => (+t.split(":")[0]) * 60 + (+t.split(":")[1]);
      await updateDoc(doc(fb.db, "shifts", v), {
        name, startMinute: toM(st), endMinute: toM(en), graceMinutes: g, otAfterMinutes: ot
      });
      S.form = {}; await loadCommon(); toast("تم حفظ الوردية"); return render();
    }
    if (a === "delShift") {
      if (!confirm("تحذف الوردية؟")) return;
      await deleteDoc(doc(fb.db, "shifts", v));
      S.form = {}; await loadCommon(); toast("تم الحذف"); return render();
    }
    if (a === "useHere") {
      const c = await getPos();
      S.form.bLat = c.latitude; S.form.bLng = c.longitude;
      S.form.bName = grab("b_name"); S.form.bRadius = grab("b_radius");
      return render();
    }
    if (a === "addBranch") {
      const name = grab("b_name").trim(), r = parseInt(grab("b_radius") || "150", 10);
      if (!name || !S.form.bLat) return toast("الاسم والموقع مطلوبين", true);
      const latDelta = r / 111320, lngDelta = r / (111320 * Math.max(0.2, Math.cos(S.form.bLat * Math.PI / 180)));
      await addDoc(collection(fb.db, "branches"), {
        name, lat: S.form.bLat, lng: S.form.bLng, radiusMeters: r,
        latDelta: +latDelta.toFixed(7), lngDelta: +lngDelta.toFixed(7)
      });
      S.form = {}; await loadCommon(); toast("تم إضافة الفرع"); return render();
    }
    if (a === "addShift") {
      const name = grab("s_name").trim(), st = grab("s_start"), en = grab("s_end");
      const g = parseInt(grab("s_grace") || "5", 10), ot = parseInt(grab("s_ot") || "15", 10);
      if (!name || !st || !en) return toast("املأ البيانات", true);
      const toM = t => (+t.split(":")[0]) * 60 + (+t.split(":")[1]);
      await addDoc(collection(fb.db, "shifts"), {
        name, startMinute: toM(st), endMinute: toM(en), graceMinutes: g,
        otAfterMinutes: ot, workdays: [0, 1, 2, 3, 4]
      });
      S.form = {}; await loadCommon(); toast("تم إضافة الوردية"); return render();
    }
    if (a === "install") {
      if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; return; }
      return toast("من قائمة المتصفح اختار «إضافة إلى الشاشة الرئيسية»");
    }
  } catch (e) {
    toast(friendly(e), true);
  }
}
function friendly(e) {
  const c = (e && e.code) || "";
  if (c.includes("wrong-password") || c.includes("invalid-credential")) return "الإيميل أو كلمة السر غلط";
  if (c.includes("user-not-found")) return "مفيش حساب بالإيميل ده";
  if (c.includes("email-already-in-use")) return "الإيميل مستخدم بالفعل";
  if (c.includes("weak-password")) return "كلمة السر ضعيفة — ٦ حروف على الأقل";
  if (c.includes("permission-denied")) return "الصلاحية مرفوضة — راجع قواعد الأمان";
  if (c.includes("unavailable")) return "مفيش نت — هيتبعت لوحده لما يرجع";
  return (e && e.message) || "حصل خطأ";
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
setInterval(() => { if (S.screen === "home" && !S.overlay) render(); }, 20000);
boot();
</script>
</body>
</html>
